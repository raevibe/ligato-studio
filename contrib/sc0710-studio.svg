<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fa9f5"/>
      <stop offset="1" stop-color="#6c4cf0"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff7a7a"/>
      <stop offset="1" stop-color="#e02828"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bg)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="47.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- capture frame -->
  <rect x="44" y="62" width="168" height="108" rx="14" fill="url(#screen)"/>
  <!-- signal waveform -->
  <path d="M60 128 L84 128 L96 98 L112 150 L126 110 L138 136 L150 128 L196 128"
        fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/>
  <!-- HDMI-style input connector -->
  <path d="M96 186 H160 V198 L150 208 H106 L96 198 Z" fill="#c9d2e3"/>
  <rect x="108" y="192" width="40" height="5" rx="2" fill="#151a24"/>
  <!-- record dot -->
  <circle cx="198" cy="70" r="24" fill="#151a24"/>
  <circle cx="198" cy="70" r="18" fill="url(#dot)"/>
</svg>
