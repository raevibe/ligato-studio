[package]
name = "sc0710-studio"
version = "0.1.2"
license = "MIT"
edition = "2021"
description = "Linux capture app for Elgato SC0710-based PCIe cards (4K60 Pro MK.2, 4K Pro, Cam Link Pro) on top of the sc0710 driver"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libc = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rayon = "1.10"
png = "0.17"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 2
